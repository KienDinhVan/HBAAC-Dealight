apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecast-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forecast-api
  template:
    metadata:
      labels:
        app: forecast-api
    spec:
      serviceAccountName: forecast-api
      containers:
        - name: forecast-api
          image: asia-southeast1-docker.pkg.dev/gen-lang-client-0222711301/dealight/forecast-api:bootstrap
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /version
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
