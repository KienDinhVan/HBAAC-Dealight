apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-training-status
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-training-status
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-training-status
subjects:
  - kind: ServiceAccount
    name: arc-runner
    namespace: arc-runners
