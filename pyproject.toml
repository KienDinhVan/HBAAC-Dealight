[project]
name = "hbacc-prj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3==1.38.33",
    "duckdb>=1.1.0",
    "evidently==0.7.21",
    "fastapi>=0.116.0",
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.16",
    "httpx>=0.28.1",
    "joblib>=1.4.0",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.9",
    "mlflow==3.9.0",
    "numpy>=2.4.5",
    "pandas>=2.2,<3",
    "polars>=1.40.1",
    "prometheus-client>=0.22.1",
    "psycopg[binary]>=3.2.9",
    "pyarrow>=19,<20",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
    "redis>=5.0",
    "requests>=2.32.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.0",
    "tqdm>=4.67.3",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
